<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>UnOpposed — everyone agrees, or nobody watches</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#14101F; --velvet:#211A33; --velvet2:#291F40; --haze:#372B52;
    --glow:#FFC24B; --glow-soft:#FFD988; --rose:#FF5C7A; --cool:#7C9BE0;
    --mist:#A99FC4; --text:#F4EEFF; --nope:#8E86A8;
    --ok:#5BD6A0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:#0C0913;
    color:var(--text);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  /* Phone frame only on wide screens; full-bleed on real phones */
  #stage{
    width:100%; height:100dvh; position:relative; overflow:hidden;
    background:var(--ink);
  }
  @media (min-width:720px){
    body{
      background:
        radial-gradient(1200px 600px at 20% -10%, #221636 0%, transparent 60%),
        radial-gradient(900px 500px at 90% 110%, #2a1030 0%, transparent 55%),
        #0C0913;
      padding:24px;
    }
    #stage{
      width:392px; height:812px; border-radius:44px;
      box-shadow:0 40px 120px rgba(0,0,0,.6), 0 0 0 11px #060409, 0 0 0 13px #241b38;
    }
  }
  .app{position:absolute; inset:0; display:flex; flex-direction:column;}

  h1,h2,h3,.display{font-family:'Bricolage Grotesque',sans-serif; letter-spacing:-.02em; margin:0;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  .muted{color:var(--mist);}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px 10px; flex:0 0 auto; z-index:6;
  }
  .brand{display:flex; align-items:center; gap:8px; font-family:'Bricolage Grotesque'; font-weight:800; font-size:20px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--glow); box-shadow:0 0 14px var(--glow);}
  .topbtns{display:flex; align-items:center; gap:8px;}
  .modechip{
    display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
    padding:7px 11px; border-radius:999px; background:var(--velvet); color:var(--mist);
    border:1px solid var(--haze);
  }
  .modechip .live{width:7px;height:7px;border-radius:50%; background:var(--rose); box-shadow:0 0 8px var(--rose);}
  .modechip .async{width:7px;height:7px;border-radius:50%; background:var(--cool); box-shadow:0 0 8px var(--cool);}
  .iconbtn{
    width:38px;height:38px;border-radius:12px;background:var(--velvet); border:1px solid var(--haze);
    display:flex;align-items:center;justify-content:center; color:var(--mist); position:relative;
  }
  .iconbtn:active{transform:scale(.94);}
  .badge{position:absolute; top:-5px; right:-5px; background:var(--rose); color:#fff; font-size:10px; font-weight:700;
    min-width:16px;height:16px;border-radius:8px; display:flex;align-items:center;justify-content:center; padding:0 4px;}

  /* ---------- Screens container ---------- */
  .screen{flex:1 1 auto; position:relative; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .pad{padding:6px 18px 24px;}

  /* ---------- Swipe deck ---------- */
  .deck{position:absolute; inset:0 18px 8px; }
  .card{
    position:absolute; inset:0; border-radius:26px; overflow:hidden;
    box-shadow:0 24px 50px rgba(0,0,0,.5); will-change:transform;
    user-select:none; touch-action:none;
    display:flex; flex-direction:column; justify-content:flex-end;
  }
  .poster{position:absolute; inset:0;}
  .poster::after{ /* film grain + darken bottom */
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(120% 80% at 50% 0%, transparent 40%, rgba(0,0,0,.25) 100%),
      linear-gradient(to top, rgba(8,4,15,.92) 0%, rgba(8,4,15,.55) 34%, transparent 60%);
  }
  .grain{position:absolute; inset:0; opacity:.10; mix-blend-mode:overlay;
    background-image:radial-gradient(rgba(255,255,255,.9) .5px, transparent .5px);
    background-size:3px 3px;}
  .postertitle{position:absolute; top:22px; left:20px; right:20px; font-family:'Bricolage Grotesque';
    font-weight:800; font-size:34px; line-height:.98; text-shadow:0 2px 20px rgba(0,0,0,.5); opacity:.16;}
  .cardbody{position:relative; padding:18px 20px 22px; z-index:2;}
  .chips{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:10px;}
  .chip{font-size:11px; font-weight:600; padding:5px 9px; border-radius:999px;
    background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.14); backdrop-filter:blur(4px);}
  .chip.svc{background:rgba(255,194,75,.16); border-color:rgba(255,194,75,.4); color:var(--glow-soft);}
  .card h2{font-size:30px; line-height:1; margin-bottom:6px;}
  .meta{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--mist); margin-bottom:10px;}
  .meta .rate{color:var(--glow); font-weight:700;}
  .why{font-size:12.5px; color:var(--mist); display:flex; align-items:center; gap:6px;}
  .overview{font-size:13px; color:#d8cff0; line-height:1.45; margin-top:10px; max-height:0; overflow:hidden; transition:max-height .3s;}
  .card.expanded .overview{max-height:120px;}
  .seenpill{position:absolute; top:20px; right:18px; z-index:3; font-size:11px; font-weight:700;
    padding:7px 11px; border-radius:999px; background:rgba(20,16,31,.7); border:1px solid var(--haze);
    color:var(--mist); display:flex; align-items:center; gap:6px; backdrop-filter:blur(6px);}
  .seenpill.on{background:rgba(91,214,160,.18); border-color:rgba(91,214,160,.5); color:var(--ok);}

  /* drag overlays */
  .stamp{position:absolute; top:34px; z-index:4; font-family:'Bricolage Grotesque'; font-weight:800;
    font-size:26px; letter-spacing:.06em; padding:8px 16px; border-radius:12px; opacity:0;
    text-transform:uppercase; pointer-events:none;}
  .stamp.yes{left:22px; color:var(--glow); border:3px solid var(--glow); transform:rotate(-14deg); box-shadow:0 0 30px rgba(255,194,75,.5);}
  .stamp.no{right:22px; color:var(--cool); border:3px solid var(--cool); transform:rotate(14deg);}
  .stamp.sup{left:50%; top:auto; bottom:120px; transform:translateX(-50%); color:var(--rose); border:3px solid var(--rose); box-shadow:0 0 30px rgba(255,92,122,.5);}
  .glowedge{position:absolute; inset:0; border-radius:26px; pointer-events:none; opacity:0; box-shadow:inset 0 0 60px 8px var(--glow);}

  .empty{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; gap:12px;}
  .empty .film{font-size:40px; filter:drop-shadow(0 6px 20px rgba(255,194,75,.4));}
  .empty h2{font-size:24px;}
  .empty p{color:var(--mist); font-size:14px; max-width:240px; line-height:1.5;}
  .textbtn{color:var(--glow); font-weight:600; font-size:14px; padding:8px 4px;}

  /* ---------- Action bar (marquee bulbs) ---------- */
  .actions{flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:16px; padding:14px 0 20px;}
  .bulb{width:60px;height:60px;border-radius:50%; display:flex;align-items:center;justify-content:center;
    background:var(--velvet); border:1px solid var(--haze); transition:transform .12s;}
  .bulb:active{transform:scale(.88);}
  .bulb.sm{width:48px;height:48px;}
  .bulb.nope{color:var(--cool);}
  .bulb.nope:active{box-shadow:0 0 26px rgba(124,155,224,.5);}
  .bulb.like{color:var(--glow); border-color:rgba(255,194,75,.5);}
  .bulb.like:active{box-shadow:0 0 30px rgba(255,194,75,.6);}
  .bulb.super{color:var(--rose); border-color:rgba(255,92,122,.5);}
  .bulb.super:active{box-shadow:0 0 30px rgba(255,92,122,.6);}
  .bulb.seen{color:var(--ok);}

  /* ---------- Bottom nav ---------- */
  .nav{flex:0 0 auto; display:flex; justify-content:space-around; padding:8px 8px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--ink), rgba(20,16,31,.4)); border-top:1px solid var(--haze);}
  .navbtn{display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; font-weight:600;
    color:var(--mist); padding:8px 12px 5px; border-radius:14px; position:relative;}
  .navbtn.active{color:var(--glow);}
  .navbtn.active svg{filter:drop-shadow(0 0 10px rgba(255,194,75,.6));}
  .navbtn .nb{position:absolute; top:2px; right:6px; width:8px;height:8px;border-radius:50%; background:var(--rose);}

  /* ---------- Generic list rows ---------- */
  .sectiontitle{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--mist); margin:18px 2px 10px;}
  .head{padding:8px 2px 2px;}
  .head h1{font-size:26px;}
  .head p{color:var(--mist); font-size:14px; margin:6px 0 0;}
  .row{display:flex; gap:12px; align-items:center; background:var(--velvet); border:1px solid var(--haze);
    border-radius:16px; padding:10px; margin-bottom:10px;}
  .thumb{width:48px;height:64px;border-radius:10px; flex:0 0 auto; position:relative; overflow:hidden;}
  .thumb .t{position:absolute; inset:0; display:flex;align-items:center;justify-content:center; font-size:20px;}
  .rowmain{flex:1 1 auto; min-width:0;}
  .rowmain .tt{font-family:'Bricolage Grotesque'; font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rowmain .sub{font-size:12px; color:var(--mist); margin-top:2px;}
  .tag{font-size:10px; font-weight:700; padding:3px 8px; border-radius:999px;}
  .tag.want{background:rgba(255,194,75,.16); color:var(--glow);}
  .tag.rewatch{background:rgba(255,92,122,.16); color:var(--rose);}

  .stars{display:flex; gap:3px;}
  .stars svg{cursor:pointer;}
  .watchtoggle{font-size:11px; font-weight:700; padding:6px 10px; border-radius:999px; border:1px solid var(--haze); background:var(--velvet2); color:var(--mist);}
  .watchtoggle.on{background:rgba(91,214,160,.16); border-color:rgba(91,214,160,.5); color:var(--ok);}

  /* ---------- Chips selectors ---------- */
  .grid{display:flex; flex-wrap:wrap; gap:9px;}
  .selchip{padding:9px 13px; border-radius:999px; background:var(--velvet); border:1px solid var(--haze);
    font-size:13px; font-weight:600; color:var(--mist); transition:all .12s;}
  .selchip.on{background:rgba(255,194,75,.16); border-color:var(--glow); color:var(--glow-soft);}
  .selchip.danger.on{background:rgba(255,92,122,.16); border-color:var(--rose); color:var(--rose);}
  .svcgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .svccard{display:flex; align-items:center; gap:10px; padding:13px; border-radius:16px; background:var(--velvet);
    border:1.5px solid var(--haze); font-weight:600; font-size:14px; transition:all .12s;}
  .svccard .sw{width:34px;height:34px;border-radius:9px; flex:0 0 auto; display:flex;align-items:center;justify-content:center; font-weight:800; color:#fff; font-size:12px;}
  .svccard.on{border-color:var(--glow); background:var(--velvet2);}
  .svccard .tick{margin-left:auto; color:var(--glow); opacity:0;}
  .svccard.on .tick{opacity:1;}

  .slider{width:100%; margin:14px 0 6px; -webkit-appearance:none; height:6px; border-radius:999px;
    background:linear-gradient(90deg,var(--glow),var(--rose)); outline:none;}
  .slider::-webkit-slider-thumb{-webkit-appearance:none; width:24px;height:24px;border-radius:50%; background:#fff;
    box-shadow:0 3px 10px rgba(0,0,0,.5); cursor:pointer;}

  .cta{display:block; width:100%; text-align:center; padding:16px; border-radius:16px; font-weight:700; font-size:16px;
    font-family:'Bricolage Grotesque'; background:linear-gradient(135deg,var(--glow),#ff9d4b); color:#1a1200;
    box-shadow:0 12px 30px rgba(255,157,75,.3); margin-top:16px;}
  .cta:active{transform:scale(.98);}
  .ghostcta{display:block; width:100%; text-align:center; padding:14px; border-radius:16px; font-weight:600;
    background:var(--velvet); border:1px solid var(--haze); color:var(--text); margin-top:10px;}

  /* ---------- Match modal ---------- */
  .overlay{position:absolute; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
    background:rgba(6,4,12,.72); backdrop-filter:blur(6px); animation:fade .25s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .matchcard{width:82%; max-width:320px; text-align:center; padding:8px;}
  .marquee{font-family:'Bricolage Grotesque'; font-weight:800; font-size:40px; line-height:.95;
    color:var(--glow); text-shadow:0 0 30px rgba(255,194,75,.6); animation:pop .5s cubic-bezier(.2,1.4,.4,1);}
  .marquee.rw{color:var(--rose); text-shadow:0 0 30px rgba(255,92,122,.6);}
  @keyframes pop{0%{transform:scale(.5); opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1); opacity:1}}
  .bulbrow{display:flex; justify-content:center; gap:7px; margin:10px 0 18px;}
  .bulbrow i{width:9px;height:9px;border-radius:50%; background:var(--glow); box-shadow:0 0 10px var(--glow); animation:blink 1s infinite;}
  .bulbrow i:nth-child(2){animation-delay:.15s} .bulbrow i:nth-child(3){animation-delay:.3s}
  .bulbrow i:nth-child(4){animation-delay:.45s} .bulbrow i:nth-child(5){animation-delay:.6s}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .posters2{display:flex; justify-content:center; gap:-10px; margin:6px 0 16px;}
  .posters2 .mini{width:96px;height:132px;border-radius:14px; box-shadow:0 14px 30px rgba(0,0,0,.5); border:2px solid rgba(255,255,255,.15);
    display:flex; align-items:flex-end; padding:8px; font-family:'Bricolage Grotesque'; font-weight:700; font-size:13px;}
  .posters2 .mini:first-child{transform:rotate(-7deg);} .posters2 .mini:last-child{transform:rotate(7deg); margin-left:-18px;}
  .matchsub{color:var(--mist); font-size:14px; margin:0 0 18px; line-height:1.5;}

  /* ---------- Onboarding ---------- */
  .intro{position:absolute; inset:0; z-index:60; background:
      radial-gradient(700px 400px at 50% -5%, #2a1840 0%, transparent 60%), var(--ink);
    display:flex; flex-direction:column; padding:0;}
  .introtop{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px;}
  .introart{font-size:64px; margin-bottom:20px; filter:drop-shadow(0 10px 30px rgba(255,194,75,.4));}
  .intro h1{font-size:36px; line-height:1.02; margin-bottom:14px;}
  .intro h1 .hl{color:var(--glow);}
  .intro p{color:var(--mist); font-size:15px; line-height:1.55; max-width:290px;}
  .dots{display:flex; gap:7px; justify-content:center; margin:22px 0;}
  .dots i{width:7px;height:7px;border-radius:50%; background:var(--haze);}
  .dots i.on{background:var(--glow); width:22px; border-radius:999px;}
  .introfoot{padding:0 24px calc(28px + env(safe-area-inset-bottom));}

  /* QR connect */
  .qrwrap{display:flex; flex-direction:column; align-items:center; gap:18px;}
  .qrbox{width:190px;height:190px; background:#fff; border-radius:20px; padding:16px; box-shadow:0 20px 50px rgba(0,0,0,.5);}
  .code{font-family:'Bricolage Grotesque'; font-weight:800; letter-spacing:.25em; font-size:26px; color:var(--glow);}
  .connected{display:flex; align-items:center; gap:8px; color:var(--ok); font-weight:700; font-size:15px;
    background:rgba(91,214,160,.12); padding:10px 16px; border-radius:999px; border:1px solid rgba(91,214,160,.4);}

  /* Guided tour bottom sheet */
  .tour{position:absolute; left:0; right:0; bottom:0; z-index:55;
    background:var(--velvet2); border-top:1px solid var(--haze); border-radius:24px 24px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom)); box-shadow:0 -20px 60px rgba(0,0,0,.5);
    animation:slideup .3s cubic-bezier(.2,.9,.3,1);}
  @keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .tour .step{font-size:11px; font-weight:700; letter-spacing:.1em; color:var(--glow); text-transform:uppercase;}
  .tour h3{font-size:21px; margin:6px 0 8px;}
  .tour p{color:#d8cff0; font-size:14px; line-height:1.5; margin:0 0 16px;}
  .tourfoot{display:flex; align-items:center; gap:10px;}
  .tourfoot .skip{color:var(--mist); font-size:13px; font-weight:600; margin-right:auto;}
  .tnext{padding:12px 22px; border-radius:12px; background:var(--glow); color:#1a1200; font-weight:700; font-family:'Bricolage Grotesque';}
  .tback{padding:12px 16px; border-radius:12px; background:var(--velvet); border:1px solid var(--haze); color:var(--mist); font-weight:600;}

  /* pulsing highlight ring for tour */
  .pulse{animation:pulse 1.3s infinite; border-radius:14px;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,194,75,.6)}70%{box-shadow:0 0 0 12px rgba(255,194,75,0)}100%{box-shadow:0 0 0 0 rgba(255,194,75,0)}}

  .hint{position:absolute; top:40%; left:50%; transform:translateX(-50%); z-index:5; text-align:center; pointer-events:none;
    color:var(--mist); font-size:13px; font-weight:600; opacity:.9;}
  .hand{font-size:34px; display:inline-block; animation:sway 1.6s ease-in-out infinite;}
  @keyframes sway{0%,100%{transform:translateX(-30px) rotate(-8deg)}50%{transform:translateX(30px) rotate(8deg)}}

  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}

  /* ---------- number pad ---------- */
  .pad3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:18px 0 6px;}
  .key{padding:18px 0; border-radius:18px; background:var(--velvet); border:1px solid var(--haze);
    font-family:'Bricolage Grotesque'; font-weight:700; font-size:26px; color:var(--text);}
  .key:active{background:var(--velvet2); transform:scale(.95);}
  .key.fn{font-size:15px; font-family:'Inter'; color:var(--mist); font-weight:600;}
  .codebox{display:flex; justify-content:center; gap:9px; margin:6px 0 4px;}
  .codebox i{width:42px; height:56px; border-radius:12px; background:var(--velvet);
    border:1.5px solid var(--haze); display:flex; align-items:center; justify-content:center;
    font-family:'Bricolage Grotesque'; font-weight:800; font-size:26px; font-style:normal;}
  .codebox i.on{border-color:var(--glow); color:var(--glow);}

  /* ---------- big session code ---------- */
  .bigcode{font-family:'Bricolage Grotesque'; font-weight:800; font-size:52px; letter-spacing:.12em;
    color:var(--glow); text-shadow:0 0 30px rgba(255,194,75,.4); text-align:center;}

  /* ---------- mood grid ---------- */
  .moods{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .mood{padding:14px 12px; border-radius:16px; background:var(--velvet); border:1.5px solid var(--haze);
    font-size:13.5px; font-weight:600; color:var(--mist); text-align:left; line-height:1.3;}
  .mood.on{border-color:var(--glow); background:var(--velvet2); color:var(--glow-soft);}

  /* ---------- toggle row ---------- */
  .tog{width:46px;height:27px;border-radius:999px;background:var(--haze); position:relative; flex:0 0 auto; transition:background .15s;}
  .tog b{position:absolute; top:3px; left:3px; width:21px;height:21px;border-radius:50%; background:#fff; transition:left .15s;}
  .tog.on{background:var(--ok);} .tog.on b{left:22px;}

  /* ---------- wildcard ---------- */
  .dice{font-size:56px; text-align:center; animation:roll .7s cubic-bezier(.2,1.3,.4,1);}
  @keyframes roll{0%{transform:rotate(-25deg) scale(.5); opacity:0}100%{transform:rotate(0) scale(1); opacity:1}}

  .tourbadge{position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:70;
    background:rgba(255,194,75,.16); border:1px solid rgba(255,194,75,.45); color:var(--glow);
    font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    padding:5px 12px; border-radius:999px;}
</style>
</head>
<body>
<div id="stage"><div id="root"></div></div>

<script type="text/babel" data-presets="react">
const {useState, useEffect, useRef} = React;

/* ============================= ICONS ============================= */

/* ============================= TMDB ============================= */
async function tmdb(path, params={}){
  const url = new URL(TMDB_BASE + path);
  Object.entries(params).forEach(([k,v])=>{ if(v!=null && v!=='') url.searchParams.set(k,v); });
  const r = await fetch(url, {headers:{Authorization:`Bearer ${TMDB_TOKEN.trim()}`, accept:'application/json'}});
  if(!r.ok) throw new Error(r.status===401 ? 'Token rejected — check your Read Access Token' : `TMDB error ${r.status}`);
  return r.json();
}

// Slate = the session's hard filters. Members' genres only re-rank, never exclude.
async function fetchSlate({slate, dealbreakers, page}){
  const mood = moodById(slate.mood) || moodById('any');
  const dec = DEC_RANGE[slate.decade];
  const d = await tmdb('/discover/movie', {
    watch_region: REGION,
    with_watch_providers: (slate.services||[]).map(id=>svc(id)?.p).filter(Boolean).join('|'),
    with_watch_monetization_types: 'flatrate',
    with_genres: mood.g.join('|'),
    without_genres: (dealbreakers||[]).map(g=>GENRE_IDS[g]).filter(Boolean).join(','),
    'with_runtime.lte': slate.maxRun,
    'primary_release_date.gte': dec ? `${dec[0]}-01-01` : null,
    'primary_release_date.lte': dec ? `${dec[1]}-12-31` : null,
    'vote_count.gte': 120,
    sort_by:'popularity.desc', include_adult:false, language:'en-US',
    page: page || 1,
  });
  return {
    pages: Math.min(d.total_pages||1, 20),
    items: (d.results||[]).map(r=>({
      id:r.id, t:r.title, y:(r.release_date||'').slice(0,4), run:null,
      gid:r.genre_ids||[], r:r.vote_average||0, poster:IMG(r.poster_path),
      o:r.overview, a:'#2b2140', b:'#4a3a6b', providers:[],
    })),
  };
}
async function enrich(m){
  if(!TMDB_ON || m._full) return m;
  try{
    const d = await tmdb(`/movie/${m.id}`, {append_to_response:'watch/providers', language:'en-US'});
    const flat = d['watch/providers']?.results?.[REGION]?.flatrate || [];
    return {...m, run:d.runtime, providers:flat.map(p=>p.provider_name), _full:true};
  }catch{ return {...m, _full:true}; }
}

// Everyone's favourite genres push matching titles up. Nobody gets excluded.
function rankDeck(items, members){
  const votes = {};
  Object.values(members||{}).forEach(mem=>{
    (mem.genres||[]).forEach(g=>{ votes[GENRE_IDS[g]] = (votes[GENRE_IDS[g]]||0)+1; });
  });
  const anyVotes = Object.keys(votes).length>0;
  return items.map(m=>{
    const score = anyVotes ? (m.gid||[]).reduce((n,g)=>n+(votes[g]||0),0) : 0;
    return {...m, _score: score + Math.random()*0.9};   // jitter keeps rooms from repeating
  }).sort((a,b)=>b._score-a._score);
}

/* ============================= ROOT (auth gate) ============================= */
function Root(){
  const [state,setState] = useState(FB_ON?'loading':'demo');
  const [user,setUser] = useState(null);
  const [profile,setProfile] = useState(null);
  const [err,setErr] = useState(null);
  const [busy,setBusy] = useState(false);

  useEffect(()=>{
    if(!FB_ON) return;
    auth.getRedirectResult().catch(()=>{});
  },[]);

  useEffect(()=>{
    if(!FB_ON) return;
    return auth.onAuthStateChanged(async u=>{
      if(!u){ setUser(null); setState('signedout'); return; }
      setUser(u);
      try{
        const cfg = u.isAnonymous ? {exists:false}
          : await db.collection('config').doc('allowlist').get();
        if(cfg.exists){
          const ok = (cfg.data().emails||[]).map(e=>String(e).toLowerCase());
          if(!ok.includes(String(u.email||'').toLowerCase())){ setState('denied'); return; }
        }
        const ref = db.collection('users').doc(u.uid);
        const snap = await ref.get();
        if(!snap.exists){
          const fresh = {email:u.email||null, name:u.displayName||pendingName||'Guest',
            guest:!!u.isAnonymous, onboarded:false, profileDone:false, createdAt:Date.now(),
            services:[], genres:[], dealbreakers:[]};
          await ref.set(fresh); setProfile(fresh);
        } else {
          const d = snap.data();
          setProfile({services:[],genres:[],dealbreakers:[],
            profileDone:(d.services||[]).length>0,   // legacy profiles predate this flag
            ...d});
          ref.set({lastActive:Date.now()},{merge:true}).catch(()=>{});
        }
        setState('ready');
      }catch(e){ console.error(e); setErr(e.message); setState('denied'); }
    });
  },[]);

  // merge:true so a patch works whether or not the doc already exists
  const saveProfile = patch => {
    setProfile(p=>({...(p||{}),...patch}));
    if(user) db.collection('users').doc(user.uid).set(patch,{merge:true}).catch(e=>console.error(e));
  };

  if(state==='loading') return <div className="intro"><div className="introtop">
    <div className="introart">🎬</div><p>Loading…</p></div></div>;

  if(state==='signedout') return <SignInScreen busy={busy} error={err}
    onSignIn={async()=>{ setBusy(true); setErr(null);
      try{ await signIn(); }catch(e){ setErr(authMessage(e)); }finally{ setBusy(false); } }}
    onAnon={async n=>{ setBusy(true); setErr(null);
      try{ await signInAnon(n); }
      catch(e){ setErr(e.code==='auth/operation-not-allowed'
        ? 'Turn on Anonymous sign-in in Firebase, then try again.' : authMessage(e)); }
      finally{ setBusy(false); } }}/>;

  if(state==='denied') return <DeniedScreen email={user?.email} onSignOut={()=>signOutNow()}/>;

  return <App user={user} profile={profile} saveProfile={saveProfile} demo={!FB_ON}/>;
}

/* ============================= APP ============================= */
function App({user,profile,saveProfile,demo}){
  const [screen,setScreen] = useState('swipe');
  const [localProfile,setLocalProfile] = useState({services:[],genres:[],dealbreakers:[],onboarded:false,profileDone:false});
  const P = demo ? localProfile : (profile||{services:[],genres:[],dealbreakers:[]});
  const save = demo ? (patch=>setLocalProfile(p=>({...p,...patch}))) : saveProfile;

  const onboarded = !!P.onboarded;
  const needsProfile = onboarded && !P.profileDone;

  const [room,setRoom] = useState(null);
  const [members,setMembers] = useState({});
  const [slate,setSlate] = useState(null);
  const [allSwipes,setAllSwipes] = useState([]);
  const [seenMatches,setSeenMatches] = useState({});

  const [deck,setDeck] = useState([]);
  const [usedPages,setUsedPages] = useState([]);
  const [refilling,setRefilling] = useState(false);
  const [maxPages,setMaxPages] = useState(1);
  const [loading,setLoading] = useState(false);
  const [apiError,setApiError] = useState(null);

  const [swipes,setSwipes] = useState({});
  const [matches,setMatches] = useState([]);
  const [watchlist,setWatchlist] = useState([]);
  const [watched,setWatched] = useState([]);
  const [matchModal,setMatchModal] = useState(null);
  const [wildcard,setWildcard] = useState(null);
  const [seenPrompt,setSeenPrompt] = useState(null);
  const [notif,setNotif] = useState(0);
  const [busy,setBusy] = useState(false);
  const [roomErr,setRoomErr] = useState(null);

  /* ---- live room sync ---- */
  useEffect(()=>{
    if(demo || !room) return;
    const ref = db.collection('sessions').doc(room);
    const offA = ref.onSnapshot(d=>{
      const data = d.data()||{};
      setMembers(data.members||{});
      if(data.slate) setSlate(data.slate);
    });
    const offB = ref.collection('swipes').onSnapshot(s=> setAllSwipes(s.docs.map(x=>x.data())) );
    return ()=>{ offA(); offB(); };
  },[room,demo]);

  /* ---- watched library ---- */
  useEffect(()=>{
    if(demo || !user) return;
    return db.collection('users').doc(user.uid).collection('watched')
      .onSnapshot(s=> setWatched(s.docs.map(d=>d.data())) );
  },[user,demo]);

  /* ---- build the deck from the Slate ---- */
  const dealbreakers = Array.from(new Set([
    ...(P.dealbreakers||[]),
    ...Object.values(members).flatMap(m=>m.dealbreakers||[]),
  ]));

  useEffect(()=>{
    if(!slate) return;
    if(slate.mode==='seen'){
      const lib = watched.filter(w=>w.rewatch).map(w=>({
        id:w.movieId, t:w.title, y:w.year, poster:w.poster, providers:[w.service],
        gid:[], r:0, a:'#2b2140', b:'#4a3a6b', o:''}));
      remember(lib); setDeck(shuffle(lib)); return;
    }
    if(!TMDB_ON){
      const pool = DEMO.filter(m=>(slate.services||[]).includes(m.s));
      setDeck(rankDeck(shuffle(pool.length?pool:DEMO), members)); return;
    }
    let dead=false; setLoading(true); setApiError(null);
    (async()=>{
      try{
        const first = await fetchSlate({slate, dealbreakers, page:1});
        const span = Math.max(1, Math.min(first.pages, 15));
        // three random pages: a deep deck, and no two rooms open on the same title
        const picks=[];
        while(picks.length < Math.min(3, span)){
          const p = 1 + Math.floor(Math.random()*span);
          if(!picks.includes(p)) picks.push(p);
        }
        const pages = await Promise.all(picks.map(p =>
          p===1 ? first : fetchSlate({slate, dealbreakers, page:p})));
        const seen=new Set();
        const items = pages.flatMap(r=>r.items)
          .filter(m => seen.has(m.id) ? false : (seen.add(m.id), true));
        const ranked = rankDeck(shuffle(items), members);
        const head = await Promise.all(ranked.slice(0,4).map(enrich));
        const full = [...head, ...ranked.slice(4)];
        remember(full);
        if(!dead){ setDeck(full); setUsedPages(picks); setMaxPages(span); }
      }catch(e){ if(!dead) setApiError(e.message); }
      finally{ if(!dead) setLoading(false); }
    })();
    return ()=>{ dead=true; };
  },[slate, watched.length]);

  const visible = deck.filter(m=>!swipes[m.id]);

  // Top the deck up before it runs dry, so a room never stalls mid-session.
  useEffect(()=>{
    if(!slate || !TMDB_ON || slate.mode==='seen') return;
    if(visible.length > 8 || refilling || usedPages.length >= maxPages) return;
    let dead=false; setRefilling(true);
    (async()=>{
      try{
        let p=null;
        for(let i=0;i<30 && p===null;i++){
          const c = 1 + Math.floor(Math.random()*maxPages);
          if(!usedPages.includes(c)) p=c;
        }
        if(p===null) return;
        const r = await fetchSlate({slate, dealbreakers, page:p});
        const have = new Set(deck.map(m=>m.id));
        const fresh = r.items.filter(m=>!have.has(m.id));
        remember(fresh);
        if(!dead && fresh.length){
          setDeck(d=>[...d, ...rankDeck(fresh, members)]);
          setUsedPages(u=>[...u,p]);
        }
      }catch(e){ /* silent: the deck still has cards */ }
      finally{ if(!dead) setRefilling(false); }
    })();
    return ()=>{ dead=true; };
  },[visible.length, slate]);

  /* ---- matching ---- */
  useEffect(()=>{
    if(demo || !room) return;
    const ids = Object.keys(members);
    if(ids.length < 2) return;
    const byMovie = {};
    allSwipes.forEach(sw=>{ (byMovie[sw.movieId]=byMovie[sw.movieId]||[]).push(sw); });
    Object.entries(byMovie).forEach(([mid,list])=>{
      const yes  = list.filter(x=>x.dir==='like'||x.dir==='super');
      const seen = list.filter(x=>x.dir==='seen');
      const all = yes.length===ids.length;
      const rewatch = seen.length===ids.length;
      if((all||rewatch) && !seenMatches[mid]){
        const any=list[0];
        const m = movie(Number(mid)) || {id:Number(mid), t:any.title, poster:any.poster,
          y:any.year, providers:any.service?[any.service]:[], a:'#2b2140', b:'#4a3a6b', gid:[], r:0};
        REG[m.id]=m;
        setSeenMatches(p=>({...p,[mid]:true}));
        addMatch(m, rewatch?'rewatch':'want');
      }
    });
  },[allSwipes,members,room,demo]);

  // Live standings: every swipe counts, so the room always has something to look at.
  const leaderboard = (()=>{
    if(demo || !room) return [];
    const total = Math.max(1, Object.keys(members).length);
    const by = {};
    allSwipes.forEach(sw=>{
      const e = by[sw.movieId] || (by[sw.movieId] = {id:sw.movieId, yes:0, swiped:0,
        title:sw.title, poster:sw.poster, year:sw.year, service:sw.service});
      e.swiped++;
      if(sw.dir==='like'||sw.dir==='super') e.yes++;
    });
    return Object.values(by).filter(e=>e.yes>0)
      .sort((a,b)=> b.yes-a.yes || b.swiped-a.swiped)
      .slice(0,15)
      .map(e=>({...e, total, unanimous: total>1 && e.yes===total}));
  })();

  function addMatch(m,type){
    setMatches(x=> x.find(i=>i.id===m.id)? x : [...x,{id:m.id,type}]);
    setWatchlist(x=> x.find(i=>i.id===m.id)? x : [...x,{id:m.id,watched:false,rating:0}]);
    setMatchModal({movie:m,type}); setNotif(n=>n+1);
  }

  function handleSwipe(m,dir){
    setSwipes(s=>({...s,[m.id]:dir}));
    if(dir==='seen'){ setSeenPrompt(m); }
    if(!demo && room) recordSwipe(room,user.uid,m,dir).catch(e=>console.error(e));
  }

  const yesCount = m => {
    if(demo||!room||!m) return null;
    const n = allSwipes.filter(s=>s.movieId===m.id&&(s.dir==='like'||s.dir==='super')).length;
    const total = Math.max(1,Object.keys(members).length);
    return total>1 ? {n,total} : null;
  };

  /* ---- room actions ---- */
  const doCreate = async newSlate=>{
    setBusy(true); setRoomErr(null);
    try{
      const s = {...newSlate, services: newSlate.services?.length? newSlate.services : (P.services||[])};
      if(demo){ setRoom('DEMO'); setSlate(s); }
      else {
        const code = await createRoom(user.uid, user.displayName||P.name, P, s);
        setRoom(code); setSlate(s);
      }
      setSwipes({}); setScreen('room');
    }catch(e){ setRoomErr(e.message); } finally{ setBusy(false); }
  };
  const doJoin = async code=>{
    setBusy(true); setRoomErr(null);
    try{
      const c = await joinRoom(code, user.uid, user.displayName||P.name, P);
      setRoom(c); setSwipes({}); setScreen('room');
    }catch(e){ setRoomErr(e.message); } finally{ setBusy(false); }
  };
  const leaveRoom = ()=>{ setRoom(null); setSlate(null); setMembers({}); setAllSwipes([]); setDeck([]); };

  useEffect(()=>{
    if(demo||!user||room) return;
    const c = new URLSearchParams(location.search).get('join');
    if(c) doJoin(c);
  },[user,demo]);

  const playWildcard = ()=>{
    const pool = deck.length? deck : DEMO;
    setWildcard(pool[Math.floor(Math.random()*pool.length)]);
  };

  /* ---- gates ---- */
  if(!onboarded) return <Tour onDone={()=>save({onboarded:true})}/>;
  if(needsProfile) return <ProfileScreen first P={P} save={save} watched={watched}
    onDone={()=>{ save({profileDone:true}); setScreen('swipe'); }} />;

  return (
    <div className="app">
      <TopBar room={room} members={members} notif={notif}
        onBell={()=>{setScreen('matches'); setNotif(0);}}
        onRoom={()=>setScreen(room?'room':'slate')}
        onSettings={()=>setScreen('settings')}/>

      {screen==='swipe' && (
        slate
          ? <SwipeScreen deck={visible} onSwipe={handleSwipe} loading={loading} apiError={apiError}
              yesCount={yesCount} onWildcard={playWildcard} onSlate={()=>setScreen('slate')}/>
          : <NoSlate onStart={()=>setScreen('slate')} onJoin={()=>setScreen('join')}/>
      )}
      {screen==='slate' && <SlateScreen P={P} busy={busy} error={roomErr}
        onStart={doCreate} onJoin={()=>setScreen('join')} onBack={()=>setScreen('swipe')}
        hasWatched={watched.filter(w=>w.rewatch).length}/>}
      {screen==='join' && <JoinScreen busy={busy} error={roomErr}
        onJoin={doJoin} onBack={()=>setScreen('slate')}/>}
      {screen==='room' && <RoomScreen code={room} members={members} slate={slate}
        onDone={()=>setScreen('swipe')} onLeave={()=>{leaveRoom(); setScreen('swipe');}}/>}
      {screen==='matches' && <MatchesScreen matches={matches} leaderboard={leaderboard}
        inRoom={!!room} onGo={()=>setScreen('swipe')}/>}
      {screen==='watchlist' && <WatchlistScreen watchlist={watchlist} setWatchlist={setWatchlist}
        onGo={()=>setScreen('swipe')}/>}
      {screen==='profile' && <ProfileScreen P={P} save={save} watched={watched} user={user}
        onWatched={()=>setScreen('library')} onDone={()=>setScreen('swipe')}/>}
      {screen==='library' && <LibraryScreen watched={watched} user={user} demo={demo}
        onBack={()=>setScreen('profile')}/>}
      {screen==='settings' && <SettingsScreen user={user} room={room}
        onBack={()=>setScreen('swipe')} onAbout={()=>setScreen('about')}
        onProfile={()=>setScreen('profile')} onSignOut={()=>demo?null:signOutNow()}
        onReplay={()=>save({onboarded:false})}/>}
      {screen==='about' && <AboutScreen onBack={()=>setScreen('settings')}/>}

      {['swipe','matches','watchlist','profile'].includes(screen) &&
        <BottomNav screen={screen} setScreen={setScreen} notif={notif} setNotif={setNotif}/>}

      {matchModal && <MatchModal data={matchModal}
        onClose={()=>setMatchModal(null)} onList={()=>{setMatchModal(null); setScreen('watchlist');}}/>}
      {wildcard && <WildcardModal m={wildcard} onClose={()=>setWildcard(null)}
        onAgain={playWildcard}/>}
      {seenPrompt && <SeenPrompt m={seenPrompt}
        onPick={rewatch=>{ if(!demo&&user) saveWatched(user.uid,seenPrompt,rewatch);
          else setWatched(w=>[...w,{movieId:seenPrompt.id,title:seenPrompt.t,year:seenPrompt.y,
            poster:seenPrompt.poster,service:provName(seenPrompt),rewatch}]);
          setSeenPrompt(null); }}/>}
    </div>
  );
}

/* ============================= SET THE SLATE ============================= */
function SlateScreen({P,onStart,onJoin,onBack,busy,error,hasWatched}){
  const [mood,setMood] = useState('any');
  const [maxRun,setMaxRun] = useState(120);
  const [decade,setDecade] = useState('Any');
  const [services,setServices] = useState(P.services||[]);
  const [mode,setMode] = useState('new');
  return (
    <div className="screen"><div className="pad">
      <button className="iconbtn" onClick={onBack} style={{marginBottom:12}}><I.back/></button>
      <div className="head"><h1>Set the Slate</h1>
        <p>You're setting tonight's rules for everyone in the room. Fewer rules, more matches.</p></div>

      <div className="sectiontitle">What's the mood?</div>
      <div className="moods">
        {MOODS.map(m=>(
          <button key={m.id} className={"mood"+(mood===m.id?' on':'')}
            onClick={()=>setMood(m.id)}>{m.label}</button>
        ))}
      </div>

      <div className="sectiontitle">How long have you got?</div>
      <div className="grid">
        {RUNTIMES.map(r=>(
          <button key={r.v} className={"selchip"+(maxRun===r.v?' on':'')}
            onClick={()=>setMaxRun(r.v)}>{r.label}</button>
        ))}
      </div>

      <div className="sectiontitle">How old can they be?</div>
      <div className="grid">
        {DECADES.map(d=>(
          <button key={d} className={"selchip"+(decade===d?' on':'')}
            onClick={()=>setDecade(d)}>{d}</button>
        ))}
      </div>

      <div className="sectiontitle">Whose TV are you on?</div>
      <div className="svcgrid">
        {SERVICES.map(s=>{ const on=services.includes(s.id); return (
          <button key={s.id} className={"svccard"+(on?' on':'')}
            onClick={()=>setServices(v=> on? v.filter(x=>x!==s.id):[...v,s.id])}>
            <span className="sw" style={{background:s.c}}>{s.sw}</span>{s.name}
            <span className="tick"><I.check/></span>
          </button>);})}
      </div>

      {hasWatched>0 &&
        <>
          <div className="sectiontitle">Something different</div>
          <button className={"ghostcta"+(mode==='seen'?'':'')} style={{marginTop:0,
            borderColor: mode==='seen'?'var(--glow)':'var(--haze)',
            color: mode==='seen'?'var(--glow)':'var(--text)'}}
            onClick={()=>setMode(mode==='seen'?'new':'seen')}>
            {mode==='seen'? '✓ ' : ''}Rewatch night — only films you've all seen
          </button>
        </>}

      {error && <p style={{color:'var(--rose)',fontSize:13,marginTop:12}}>{error}</p>}
      <button className="cta" disabled={busy||!services.length}
        onClick={()=>onStart({mood,maxRun,decade,services,mode})}>
        {busy?'Setting up…':'Start the room'}</button>
      {!services.length &&
        <p style={{fontSize:12,color:'var(--mist)',textAlign:'center',marginTop:8}}>
          Pick at least one service.</p>}
      <button className="ghostcta" onClick={onJoin}>Join someone else's room instead</button>
    </div></div>
  );
}

function NoSlate({onStart,onJoin}){
  return (
    <div className="screen"><div className="pad">
      <div style={{textAlign:'center',padding:'54px 16px'}}>

function SwipeScreen({deck,onSwipe,loading,apiError,yesCount,onWildcard,onSlate}){
  const top = deck[0];
  return (
    <>
      <div className="screen" style={{overflow:'hidden'}}>
        <div className="deck">
          {loading && !deck.length &&
            <div className="empty"><div className="film">🎞️</div>
              <h2>Building your Slate</h2>
              <p>Finding titles that fit tonight's rules.</p></div>}
          {apiError && !loading &&
            <div className="empty"><div className="film">⚠️</div>
              <h2>Couldn't reach TMDB</h2><p>{apiError}</p></div>}
          {!loading && !apiError && !deck.length &&
            <div className="empty">
              <div className="film">🎲</div>
              <h2>That's everything</h2>
              <p>You've been through the whole Slate. Let the Wildcard decide, or set a new Slate.</p>
              <button className="cta" style={{maxWidth:230}} onClick={onWildcard}>Play the Wildcard</button>
              <button className="textbtn" onClick={onSlate}>Set a new Slate →</button>
            </div>}
          {deck.slice(0,3).reverse().map((m,i,arr)=>{
            const depth = arr.length-1-i;
            return <Card key={m.id} m={m} depth={depth} isTop={depth===0}
              onSwipe={onSwipe} tally={depth===0? yesCount(m) : null}/>;
          })}
        </div>
      </div>
      {top && <ActionBar m={top} onSwipe={onSwipe} onWildcard={onWildcard}/>}
    </>
  );
}

function Card({m,depth,onSwipe,isTop,tally}){
  const ref = useRef(null);
  const [drag,setDrag] = useState({x:0,y:0,active:false});
  const [expanded,setExpanded] = useState(false);
  const start = useRef({x:0,y:0});

  const down = e=>{ if(!isTop) return; start.current={x:e.clientX,y:e.clientY};
    setDrag(d=>({...d,active:true})); ref.current.setPointerCapture(e.pointerId); };
  const move = e=>{ if(!drag.active) return;
    setDrag({x:e.clientX-start.current.x, y:e.clientY-start.current.y, active:true}); };
  const up = ()=>{
    if(!drag.active) return;
    const {x,y}=drag;
    if(y<-120 && Math.abs(x)<90){ setDrag({x:0,y:-800,active:false}); setTimeout(()=>onSwipe(m,'super'),180); return; }
    if(x>120){ setDrag({x:800,y,active:false}); setTimeout(()=>onSwipe(m,'like'),180); return; }
    if(x<-120){ setDrag({x:-800,y,active:false}); setTimeout(()=>onSwipe(m,'nope'),180); return; }
    setDrag({x:0,y:0,active:false});
  };

  const yesOp = Math.max(0,Math.min(1,drag.x/120));
  const noOp  = Math.max(0,Math.min(1,-drag.x/120));
  const supOp = Math.max(0,Math.min(1,-drag.y/120)) * (Math.abs(drag.x)<90?1:0);
  const style = {
    transform:`translate(${drag.x}px, ${drag.y}px) rotate(${drag.x/18}deg) scale(${1-depth*0.04})`,
    transition: drag.active?'none':'transform .35s cubic-bezier(.2,.9,.3,1)',
    opacity:1-depth*0.15, zIndex:10-depth, pointerEvents:isTop?'auto':'none',
  };
  const gens = (m.gid||[]).map(genreName).filter(Boolean).slice(0,2);

  return (
    <div ref={ref} className={"card"+(expanded?' expanded':'')} style={style}
      onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}>
      <div className="poster" style={m.poster
        ? {backgroundImage:`url(${m.poster})`,backgroundSize:'cover',backgroundPosition:'center'}
        : {background:`linear-gradient(150deg, ${m.a}, ${m.b})`}}></div>
      <div className="grain"></div>
      {!m.poster && <div className="postertitle">{m.t}</div>}
      <div className="glowedge" style={{opacity:yesOp*0.9}}></div>
      <div className="stamp yes" style={{opacity:yesOp}}>Yes</div>
      <div className="stamp no" style={{opacity:noOp}}>Pass</div>
      <div className="stamp sup" style={{opacity:supOp}}>★ Must see</div>

      <button className="seenpill" onPointerDown={e=>e.stopPropagation()}
        onClick={()=>onSwipe(m,'seen')}><I.eye/> Seen it</button>

      <div className="cardbody" onClick={()=>setExpanded(x=>!x)}>
        {tally && <div style={{fontSize:12,fontWeight:700,color:'var(--glow)',marginBottom:8}}>
          {tally.n} of {tally.total} want this</div>}
        <div className="chips">
          <span className="chip svc">{provName(m)}</span>
          {gens.map(g=><span key={g} className="chip">{g}</span>)}
        </div>
        <h2>{m.t}</h2>
        <div className="meta">
          {m.r>0 && <span className="rate">★ {m.r.toFixed(1)}</span>}
          <span>{m.y}</span>{m.run? <><span>·</span><span>{m.run} min</span></> : null}
          <a href={trailerURL(m)} target="_blank" rel="noopener noreferrer"
            onPointerDown={e=>e.stopPropagation()} onClick={e=>e.stopPropagation()}
            style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:5,
              color:'var(--glow)',textDecoration:'none',fontWeight:600}}>
            <I.play/> Trailer</a>
        </div>
        {m.o && <div className="overview">{m.o}</div>}
      </div>
    </div>
  );
}

        </p>
        <a className="ghostcta" href={trailerURL(m)} target="_blank" rel="noopener noreferrer"
          style={{display:'block',textDecoration:'none',marginTop:0}}>Watch the trailer</a>
        <button className="cta" onClick={onList}>Add to watchlist</button>
        <button className="ghostcta" onClick={onClose}>Keep swiping</button>
      </div>
    </div>
  );
}

function WildcardModal({m,onClose,onAgain}){
  return (
    <div className="overlay" onClick={onClose}>
      <div className="matchcard" onClick={e=>e.stopPropagation()}>
        <div className="dice">🎲</div>
        <div className="marquee" style={{fontSize:30}}>WILDCARD</div>
        <p className="matchsub" style={{marginTop:14}}>
          The dice picked <b style={{color:'var(--text)'}}>{m.t}</b>
          {m.y?` (${m.y})`:''} on {provName(m)}. That's the one.
        </p>
        <a className="cta" href={trailerURL(m)} target="_blank" rel="noopener noreferrer"
          style={{display:'block',textDecoration:'none'}}>Watch the trailer</a>
        <button className="ghostcta" onClick={onAgain}>Roll again</button>
        <button className="ghostcta" onClick={onClose}>Back to swiping</button>
      </div>
    </div>
  );
}

function SeenPrompt({m,onPick}){
  return (
    <div className="overlay">
      <div className="matchcard" onClick={e=>e.stopPropagation()}>
        <div style={{fontSize:40,textAlign:'center'}}>👀</div>
        <h2 style={{fontFamily:'Bricolage Grotesque',fontSize:24,textAlign:'center',margin:'10px 0 6px'}}>
          Added to your library</h2>
        <p className="matchsub"><b style={{color:'var(--text)'}}>{m.t}</b> is in your seen list.
          Would you watch it again?</p>
        <button className="cta" onClick={()=>onPick(true)}>Yes, happily</button>
        <button className="ghostcta" onClick={()=>onPick(false)}>Once was enough</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
